  - title: 客户端开发工程师 - 益世界
    duration: "2025年2月 - 至今"
    tags:
    - 开发
    - 优化
    summary: UI架构设计与优化经验
    detail: 
    - 主导设计并搭建了基于 MVP 模式的 UI 框架，通过响应式数据绑定实现业务逻辑与视图的解耦，规范化UI开发流程。
